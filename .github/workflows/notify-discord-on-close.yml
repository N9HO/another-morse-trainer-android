# Posts a message back to the originating Discord thread(s) when an issue that
# the triage bot filed is closed (e.g. a fix is merged). The bot stamps each
# issue it opens with an HTML comment "<!-- discord-thread:<id> -->" — and adds
# the same marker in a comment when it attaches a duplicate report's thread to
# an existing issue — so EVERY reporter's thread gets the ping, not just the
# first. This reads the markers from the body and all comments and posts to
# each thread via a Discord channel webhook.
#
# Requires a repository secret DISCORD_WEBHOOK_URL:
#   In Discord: the channel the triage threads live in -> Edit Channel ->
#   Integrations -> Webhooks -> New Webhook -> Copy Webhook URL.
#   Then GitHub: Settings -> Secrets and variables -> Actions -> new secret
#   named DISCORD_WEBHOOK_URL.
#
# NOTE: must be on the default branch (main) to fire on issue events.

name: Notify Discord on issue close

on:
  issues:
    types: [closed]

permissions:
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post resolution to the Discord thread(s)
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping."
            exit 0
          fi

          # Markers from the issue body (the original reporter's thread)…
          BODY_MARKERS="$(printf '%s' "$ISSUE_BODY" \
            | grep -oE 'discord-thread:[0-9]+' || true)"

          # …and from comments (threads the bot attached for duplicate reports).
          # One page of 100 comments is plenty for this project's issues.
          COMMENT_MARKERS="$(curl -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            | jq -r '.[].body // empty' \
            | grep -oE 'discord-thread:[0-9]+' || true)"

          THREAD_IDS="$(printf '%s\n%s\n' "$BODY_MARKERS" "$COMMENT_MARKERS" \
            | cut -d: -f2 | grep -E '^[0-9]+$' | sort -u || true)"
          if [ -z "${THREAD_IDS:-}" ]; then
            echo "No discord-thread markers on this issue; nothing to notify."
            exit 0
          fi

          if [ "${STATE_REASON:-}" = "not_planned" ]; then
            MSG="🗑️ Issue #${ISSUE_NUMBER} (\"${ISSUE_TITLE}\") was closed as not planned: ${ISSUE_URL}"
          else
            MSG="✅ Good news — this is fixed! Issue #${ISSUE_NUMBER} (\"${ISSUE_TITLE}\") has been closed: ${ISSUE_URL}"
          fi

          # jq builds correctly-escaped JSON; thread_id targets each thread.
          # One unreachable thread (e.g. deleted) shouldn't stop the others.
          for TID in $THREAD_IDS; do
            jq -n --arg content "$MSG" '{content: $content}' \
              | curl -sS -X POST -H "Content-Type: application/json" \
                     --data @- "${WEBHOOK}?thread_id=${TID}&wait=true" \
              || echo "WARNING: failed to notify thread ${TID}"
            echo
          done
